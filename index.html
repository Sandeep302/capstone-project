<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyScan — Air Quality Index</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<header>
  <div class="logo">Sky<span>Scan</span></div>
  <div class="tagline">by Sandeep</div>
</header>

<main class="card">

  <div class="search-row">
    <input type="text" id="cityInput" placeholder="Enter City Name" autocomplete="off" />
    <button class="btn-search" id="searchBtn">Search</button>
    <button class="btn-history" id="historyBtn">Show History</button>
  </div>

  <div class="msg-box msg-error" id="errorBox"></div>

  <div class="msg-box msg-loading" id="loadingBox">
    <div class="spinner"></div>
    <span>Fetching data...</span>
  </div>

  <div class="result-box" id="resultBox">

    <div class="terminal-block">
      <div class="t-divider"></div>

      <div class="t-row">
        <span class="t-key">:</span>
        <span id="resLocation"></span>
      </div>

      <div class="t-row">
        <span class="t-key">LATITUDE:</span>
        <span id="resLat"></span>
      </div>

      <div class="t-row">
        <span class="t-key">LONGITUDE:</span>
        <span id="resLon"></span>
      </div>

      <div class="t-divider"></div>

      <div class="t-row aqi-row">
        <span class="t-key">Air Quality Index:</span>
        <span id="aqiNum" class="aqi-num"></span>
      </div>

      <div class="t-row" id="aqiMsg"></div>

      <div class="t-row saved-row">
        <span class="saved-icon">&#10003;</span> Successfully saved to history.
      </div>
    </div>

    <div class="warning-banner" id="warningBanner">
      <div class="warn-top">
        <span class="warn-icon" id="warnIcon"></span>
        <span class="warn-label" id="warnLabel"></span>
      </div>
      <div class="warn-msg" id="warnMsg"></div>
      <div class="warn-advice" id="warnAdvice"></div>
    </div>

  </div>

  <div id="historySection" style="display:none;">
    <div class="hist-header-row">
      <span class="section-label">History</span>
      <button class="btn-clear" id="clearBtn">Clear</button>
    </div>

    <div class="hist-table">
      <div class="hist-thead">
        <span>ID</span>
        <span>City</span>
        <span>Country</span>
        <span>AQI</span>
        <span>Time</span>
      </div>

      <div id="historyList"></div>
    </div>
  </div>

</main>

<footer>SkyScan — Project Demo | Spring 26 - THE PRACTISE OF COMPUTER PROGRAMMING</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
